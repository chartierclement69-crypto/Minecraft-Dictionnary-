name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configuration Pages (activation automatique)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparation des fichiers du site
        run: mkdir -p _site && cp index.html style.css script.js data1.js data2.js extra.js og-image.png robots.txt sitemap.xml _site/
      - name: Upload de l'artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
